name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The repo's rust-toolchain.toml pins a Windows host triple, which the runners' rustup rejects.
  RUSTUP_TOOLCHAIN: stable

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p app
      - uses: actions/upload-artifact@v4
        with:
          name: sennheiser-control-windows
          path: target/release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos
      - name: Build release
        run: |
          set +e
          cargo build --release --color never 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Publish the compiler errors as a public annotation (readable without logging in).
            msg=$(grep -A8 -E '^error' build.log | head -c 40000 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo build errors::$msg"
          fi
          exit $code
      - name: Bundle .app
        run: |
          chmod +x scripts/bundle-app.sh
          ./scripts/bundle-app.sh || true
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: sennheiser-control-macos
          path: |
            macos/target/release/sennheiser-control
            macos/**/*.app
          if-no-files-found: warn

