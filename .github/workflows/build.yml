name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The repo's rust-toolchain.toml pins a Windows host triple, which the runners' rustup rejects.
  RUSTUP_TOOLCHAIN: stable

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem target/release/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/sennheiser-control-windows.exe
          Compress-Archive -Path dist/sennheiser-control-windows.exe -DestinationPath dist/sennheiser-control-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: sennheiser-control-windows
          path: dist/sennheiser-control-windows.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos
      - name: Build release
        run: |
          set +e
          cargo build --release --color never 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Publish the compiler errors as a public annotation (readable without logging in).
            msg=$(grep -A8 -E '^error' build.log | head -c 40000 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo build errors::$msg"
          fi
          exit $code
      - name: Bundle .app
        run: |
          set +e
          chmod +x scripts/bundle-app.sh
          ./scripts/bundle-app.sh 2>&1 | tee bundle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 40 bundle.log | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error title=bundle errors::$msg"
          fi
          exit $code
      - name: Package
        run: |
          mkdir -p ../dist
          ditto -c -k --sequesterRsrc --keepParent "target/release/bundle/Sennheiser Control.app" ../dist/sennheiser-control-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sennheiser-control-macos
          path: dist/sennheiser-control-macos.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
